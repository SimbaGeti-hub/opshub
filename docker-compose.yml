services:
  postgres:
    image: postgres:16-alpine
    container_name: opshub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: opshub
      POSTGRES_PASSWORD: opshub_dev_password
      POSTGRES_DB: opshub
    ports:
      - '5432:5432'
    volumes:
      - opshub-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U opshub -d opshub']
      interval: 5s
      timeout: 5s
      retries: 10
    profiles: ['infra', 'full']

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: opshub-keycloak
    restart: unless-stopped
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/opshub_keycloak
      KC_DB_USERNAME: opshub
      KC_DB_PASSWORD: opshub_dev_password
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_ENABLED: 'true'
    ports:
      - '8080:8080'
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ['infra', 'full']

volumes:
  opshub-postgres-data:
