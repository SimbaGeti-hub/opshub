<div
  class="flex flex-col gap-3 rounded-[var(--radius-lg)] border border-[var(--color-border)] bg-[var(--color-surface)] p-5 shadow-[var(--shadow-sm)]"
>
  <div class="flex items-center justify-between">
    <span class="text-sm font-medium text-[var(--color-text-muted)]"
      >{{ label() }}</span
    >
    <span
      class="flex h-9 w-9 items-center justify-center rounded-[var(--radius-md)] bg-[var(--color-primary)]/10 text-[var(--color-primary)]"
    >
      <svg [lucideIcon]="icon()" class="h-5 w-5"></svg>
    </span>
  </div>

  <span class="text-3xl font-semibold text-[var(--color-text)]"
    >{{ value() }}</span
  >

  @if (trendValue()) {
  <div class="flex items-center gap-1.5 text-sm">
    <span [class]="trendClasses()" class="flex items-center gap-1">
      <svg [lucideIcon]="trendIcon()" class="h-4 w-4"></svg>
      {{ trendValue() }}
    </span>
    <span class="text-[var(--color-text-muted)]">{{ comparisonLabel() }}</span>
  </div>
  }
</div>
