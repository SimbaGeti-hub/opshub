<div
  class="flex flex-col gap-4 rounded-[var(--radius-lg)] border border-[var(--color-border)] bg-[var(--color-surface)] p-5 shadow-[var(--shadow-sm)]"
>
  <div class="flex items-start justify-between gap-4">
    <div class="flex flex-col gap-1">
      <h3 class="text-base font-semibold text-[var(--color-text)]">
        {{ title() }}
      </h3>
      @if (description()) {
      <p class="text-sm text-[var(--color-text-muted)]">{{ description() }}</p>
      }
    </div>
    <ng-content select="[chartLegend]" />
  </div>

  <div class="relative min-h-64">
    @if (loading()) {
    <div class="flex h-64 items-center justify-center">
      <div
        class="h-8 w-8 animate-spin rounded-full border-2 border-[var(--color-border)] border-t-[var(--color-primary)]"
      ></div>
    </div>
    } @else if (empty()) {
    <div
      class="flex h-64 flex-col items-center justify-center gap-2 text-center"
    >
      <span class="text-sm font-medium text-[var(--color-text)]"
        >No data yet</span
      >
      <span class="text-sm text-[var(--color-text-muted)]"
        >Data will appear here once available</span
      >
    </div>
    } @else {
    <ng-content />
    }
  </div>
</div>
