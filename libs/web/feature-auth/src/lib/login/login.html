<div
  class="flex min-h-screen items-center justify-center bg-[var(--color-bg)] px-4"
>
  <div
    class="flex w-full max-w-sm flex-col items-center gap-6 rounded-[var(--radius-lg)] border border-[var(--color-border)] bg-[var(--color-surface)] p-8 shadow-[var(--shadow-md)]"
  >
    <div class="flex flex-col items-center gap-2 text-center">
      <span class="text-2xl font-semibold text-[var(--color-text)]"
        >OpsHub</span
      >
      <p class="text-sm text-[var(--color-text-muted)]">
        One workspace for smarter operations.
      </p>
    </div>

    <ops-button variant="primary" size="lg" (click)="signIn()" class="w-full">
      Sign in
    </ops-button>

    <p class="text-center text-xs text-[var(--color-text-muted)]">
      You'll be redirected to sign in securely through OpsHub's identity
      provider.
    </p>
  </div>
</div>
