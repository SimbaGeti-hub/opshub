<div class="flex min-h-[60vh] items-center justify-center px-4">
  <div class="flex max-w-md flex-col items-center gap-4 text-center">
    <span
      class="flex h-12 w-12 items-center justify-center rounded-full bg-[var(--color-danger-bg)] text-[var(--color-danger)]"
    >
      <svg [lucideIcon]="'shield-alert'" class="h-6 w-6"></svg>
    </span>

    <h1 class="text-2xl font-semibold text-[var(--color-text)]">
      You do not have access to this page
    </h1>
    <p class="text-sm text-[var(--color-text-muted)]">
      Your role does not include this area. If you think that is a mistake, ask
      an administrator to review your access.
    </p>

    <a
      routerLink="/dashboard"
      class="inline-flex h-10 items-center justify-center rounded-[var(--radius-md)] bg-[var(--color-primary)] px-4 text-sm font-medium text-white transition-colors duration-[var(--motion-fast)] hover:bg-[var(--color-primary-hover)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-primary)] focus-visible:ring-offset-2"
    >
      Back to dashboard
    </a>
  </div>
</div>
