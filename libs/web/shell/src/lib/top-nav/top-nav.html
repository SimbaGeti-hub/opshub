<header
  class="flex h-16 items-center justify-between border-b border-[var(--color-border)] bg-[var(--color-surface)] px-6"
>
  <div
    class="flex max-w-md flex-1 items-center gap-2 rounded-[var(--radius-md)] border border-[var(--color-border)] bg-[var(--color-bg)] px-3 py-2"
  >
    <svg
      [lucideIcon]="'search'"
      class="h-4 w-4 text-[var(--color-text-muted)]"
    ></svg>
    <input
      type="search"
      placeholder="Search..."
      class="w-full bg-transparent text-sm text-[var(--color-text)] placeholder:text-[var(--color-text-muted)] focus:outline-none"
    />
  </div>

  <div class="flex items-center gap-3">
    <ops-icon-button label="Toggle theme" (click)="toggleTheme()">
      <svg [lucideIcon]="'sun-moon'" class="h-5 w-5"></svg>
    </ops-icon-button>

    <ops-icon-button label="Notifications">
      <svg [lucideIcon]="'bell'" class="h-5 w-5"></svg>
    </ops-icon-button>

    <ops-avatar name="Simba Geti" size="sm" />
  </div>
</header>
